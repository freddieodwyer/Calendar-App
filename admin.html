<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage group</title>
<style>
:root { --bg:#fff; --fg:#111; --muted:#6b7280; --card:#f3f4f6; --free:#16a34a; --busy:#dc2626; --accent:#2563eb; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111; --fg:#f3f4f6; --muted:#9ca3af; --card:#1f2937; }
}
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
main { max-width:480px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:1.4rem; margin:0 0 4px; }
h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:24px 0 8px; }
.sub { color:var(--muted); font-size:.9rem; margin-bottom:20px; }
.row { display:flex; justify-content:space-between; align-items:center;
       background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:8px; }
.name { font-weight:600; }
.until { color:var(--muted); font-size:.9rem; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:10px; }
.free .dot { background:var(--free); }
.busy .dot { background:var(--busy); }
.off .dot, .error .dot { background:var(--muted); }
.empty, .note { color:var(--muted); font-size:.9rem; }
form { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
input[type=text], input[type=url], input[type=datetime-local] { padding:12px; border-radius:10px; border:1px solid var(--muted);
       background:var(--bg); color:var(--fg); font-size:1rem; }
button { padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff;
         font-size:1rem; cursor:pointer; }
button.secondary { background:var(--card); color:var(--fg); }
button.danger { background:var(--busy); }
details { margin-top:28px; background:var(--card); border-radius:12px; padding:14px 16px; }
summary { font-weight:600; cursor:pointer; }
.error-msg { color:var(--busy); font-size:.9rem; }
.linkbox { word-break:break-all; background:var(--bg); padding:10px; border-radius:8px; font-size:.85rem; margin:8px 0; }
[hidden] { display:none !important; }
.btn { display:block; text-align:center; padding:12px; border-radius:10px; background:var(--card);
       color:var(--fg); text-decoration:none; margin-top:20px; font-weight:600; }
.card { background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:12px;
        display:flex; flex-direction:column; gap:10px; }
.card details { background:var(--bg); margin-top:0; }
</style>
</head>
<body>
<main>
  <h1 id="title">Manage group</h1>
  <div class="sub">Rename, replace or remove people. Calendar links are never shown here.</div>
  <div id="people"></div>
  <p><a id="back" href="/">Back to the group</a></p>
  <details>
    <summary>Your admin link</summary>
    <div class="linkbox" id="admin-link"></div>
    <p class="note">Anyone with this link can manage the group, so keep it private.</p>
  </details>
</main>
<script>
const CODE = location.pathname.split("/")[2];
const API = "/api/admin/" + CODE;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function send(url, options, errorBox) {
  errorBox.textContent = "";
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({error: "Something went wrong. Try again."}));
  if (!res.ok) { errorBox.textContent = data.error; return false; }
  return true;
}

function makeCard(person) {
  const error = el("div", {className: "error-msg"});
  const nameInput = el("input", {type: "text", value: person.name, maxLength: 30});
  const saveName = el("button", {type: "button", className: "secondary", textContent: "Save name"});
  const kind = el("div", {className: "note", textContent: person.kind === "link" ? "Live calendar link" : "Uploaded file"});
  const link = el("input", {type: "url", name: "link", placeholder: "New calendar link"});
  const file = el("input", {type: "file", name: "file", accept: ".ics,text/calendar"});
  const form = el("form", {},
    link,
    el("label", {className: "note", textContent: "or upload an .ics file "}, file),
    el("button", {type: "submit", textContent: "Replace calendar"}));
  const details = el("details", {}, el("summary", {textContent: "Replace calendar"}), form);
  const remove = el("button", {type: "button", className: "danger", textContent: "Remove"});
  const base = API + "/people/" + person.id;

  saveName.onclick = async () => {
    const options = {method: "POST", headers: {"Content-Type": "application/json"},
                     body: JSON.stringify({name: nameInput.value})};
    if (await send(base + "/rename", options, error)) load();
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (await send(base + "/calendar", {method: "POST", body: new FormData(form)}, error)) load();
  };
  remove.onclick = async () => {
    if (!confirm("Remove " + person.name + " from the group?")) return;
    if (await send(base, {method: "DELETE"}, error)) load();
  };
  return el("div", {className: "card"}, nameInput, saveName, kind, details, remove, error);
}

async function load() {
  const res = await fetch(API);
  if (!res.ok) {
    document.getElementById("title").textContent = "Invalid admin link";
    return;
  }
  const data = await res.json().catch(() => ({error: "Something went wrong. Try again."}));
  document.getElementById("title").textContent = "Manage " + data.group;
  document.getElementById("back").href = "/g/" + data.group_id;
  document.getElementById("admin-link").textContent = location.href;
  try { localStorage.setItem("admin:" + data.group_id, CODE); } catch (e) {}
  const list = document.getElementById("people");
  list.replaceChildren(...data.people.map(makeCard));
  if (data.people.length === 0) list.append(el("p", {className: "empty", textContent: "Nobody in this group yet."}));
}

load();
</script>
</body>
</html>
